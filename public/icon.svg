<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FaceArcade">
  <title>FaceArcade</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171243" />
      <stop offset="0.55" stop-color="#0a0830" />
      <stop offset="1" stop-color="#04041a" />
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ff0ff" />
      <stop offset="0.52" stop-color="#7b5cff" />
      <stop offset="1" stop-color="#ff3fd6" />
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ff0ff" stop-opacity="0.6" />
      <stop offset="1" stop-color="#ff3fd6" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.55" />
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="weave" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(15 256 256)">
      <path d="M0 0H34M0 0V34" stroke="#6ea8ff" stroke-opacity="0.42" stroke-width="1.6" fill="none" />
      <path d="M0 34L34 0" stroke="#6ea8ff" stroke-opacity="0.22" stroke-width="1.4" fill="none" />
    </pattern>
    <clipPath id="headClip"><path d="M256 96c-76 0-124 47-124 122v46c0 74 55 124 124 124s124-50 124-124v-46c0-75-48-122-124-122z" /></clipPath></defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)" />
       <rect width="512" height="512" rx="116" fill="url(#bloom)" />
       <rect x="7" y="7" width="498" height="498" rx="110" fill="none" stroke="url(#neon)" stroke-width="9" stroke-opacity="0.95" />
  
  <g stroke="#3ff0ff" stroke-opacity="0.5" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M96 152V116a20 20 0 0 1 20-20h36" />
    <path d="M416 152V116a20 20 0 0 0-20-20h-36" />
    <path d="M96 372v36a20 20 0 0 0 20 20h36" />
    <path d="M416 372v36a20 20 0 0 1-20 20h-36" />
  </g>
  <g clip-path="url(#headClip)">
    <rect x="120" y="84" width="272" height="320" fill="#080a28" />
    <rect x="120" y="84" width="272" height="320" fill="url(#weave)" />
    <ellipse cx="256" cy="242" rx="150" ry="150" fill="url(#bloom)" />
  </g>
  <path d="M256 96c-76 0-124 47-124 122v46c0 74 55 124 124 124s124-50 124-124v-46c0-75-48-122-124-122z" fill="none" stroke="url(#mesh)" stroke-width="12" filter="url(#glow)" />
  <g filter="url(#glow)">
    <circle cx="203" cy="228" r="20" fill="#3ff0ff" />
    <path d="M281 238q29-28 58 0" fill="none" stroke="#ff3fd6" stroke-width="15" stroke-linecap="round" />
    <path d="M198 300q58 58 116 0" fill="none" stroke="#3ff0ff" stroke-width="16" stroke-linecap="round" />
